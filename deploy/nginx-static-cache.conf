# Add these locations inside the michaelstoffer.com Nginx server block.
# Static files are served by Nginx, so Laravel middleware cannot set their headers.

location ^~ /build/assets/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /media/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
}

location ^~ /fonts/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
}
