<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Wakebot — community automation for Nerrowake</title>
  <desc id="desc">An editorial title card for Wakebot, highlighting moderation, participation, and community workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#172b3a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1370" cy="180" r="280" fill="#2dd4bf" opacity=".05"/>
  <circle cx="1460" cy="780" r="380" fill="#818cf8" opacity=".06"/>
  <path d="M110 165H210" stroke="#5eead4" stroke-width="6"/>
  <text x="110" y="225" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="26" letter-spacing="6">NERROWAKE</text>
  <text x="105" y="405" fill="#f8fafc" font-family="Arial, sans-serif" font-size="150" font-weight="700" letter-spacing="-5">Wakebot</text>
